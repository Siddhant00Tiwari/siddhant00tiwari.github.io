name: Fetch Credly Badges

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight
  workflow_dispatch: # Allow manual trigger

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Fetch badges JSON
        run: |
          mkdir -p assets/data
          curl -s -L "https://www.credly.com/users/siddhant-tiwari.d9aaf649/badges.json" -o assets/data/badges.json
          
      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/badges.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update credly badges" && git push)
